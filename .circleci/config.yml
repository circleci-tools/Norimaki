version: 2.1

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          keys:
            - jars-{{ checksum "build.gradle" }}-{{ checksum  "app/build.gradle" }}
            - builds-{{ .Revision }}
            - app-builds-{{ .Revision }}
jobs:
  build:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Download Dependencies
          command: ./gradlew dependencies
      - run:
          name: Build
          command: ./gradlew assembleDebugUnitTest
      - save_cache:
          paths:
            - ~/.gradle
          key: jars-{{ checksum "build.gradle" }}-{{ checksum  "app/build.gradle" }}
      - save_cache:
          paths:
            - ~/norimaki/build
          key: builds-{{ .Revision }}
      - save_cache:
          paths:
            - ~/norimaki/app/build
          key: app-builds-{{ .Revision }}

  test:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Run Tests
          command: ./gradlew jacoco
      - run:
          name: Send coverage
          command: ./scripts/ci/send-coverage-info.sh
  deploy:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6g
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Publish APK
          command: ./gradlew publishReleaseApk
  release-apk:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6g
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Build release APK
          command: ./gradlew assembleRelease
      - store_artifacts:
          path: app/build/outputs/apk/release
      - run:
          name: Upload APK to GitHub Release
          command: ./scripts/ci/upload-release-apk.sh

workflows:
  test-and-deploy:
    jobs:
      - build
      - test: { requires: [build] }
      - deploy:
          filters:
            branches:
              only: master
          requires: [test]
  release:
    jobs:
      - release-apk:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
