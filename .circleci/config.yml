version: 2.1

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          keys:
            - jars-{{ checksum "build.gradle" }}-{{ checksum  "app/build.gradle" }}
            - builds-{{ .Revision }}
            - app-builds-{{ .Revision }}
jobs:
  build:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Download Dependencies
          command: ./gradlew dependencies
      - run:
          name: Build
          command: ./gradlew assembleDebugUnitTest
      - save_cache:
          paths:
            - ~/.gradle
          key: jars-{{ checksum "build.gradle" }}-{{ checksum  "app/build.gradle" }}
      - save_cache:
          paths:
            - ~/norimaki/build
          key: builds-{{ .Revision }}
      - save_cache:
          paths:
            - ~/norimaki/app/build
          key: app-builds-{{ .Revision }}

  test:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Install Android SDK Build Tools
          command: |
            sdkmanager "build-tools;37.0.0"
            test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          max_auto_reruns: 2
          auto_rerun_delay: 10s
      - run:
          name: Run Tests
          command: ./gradlew jacoco
      - run:
          name: Verify Kotest and Vintage execution
          command: python3 scripts/ci/check-unit-test-results.py
      - run:
          name: Test release tag validation
          command: bash scripts/ci/test-release-tag.sh
      - run:
          name: Test tagged Play deployment
          command: bash scripts/ci/test-play-deploy.sh
      - run:
          name: Send coverage
          command: ./scripts/ci/send-coverage-info.sh
  deploy:
    working_directory: ~/norimaki
    docker:
      - image: cimg/android:2026.02.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6g
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Validate release tag
          command: ./gradlew :app:validateReleaseTag
      - run:
          name: Publish APK
          command: ./gradlew publishReleaseApk --track internal

workflows:
  test-and-deploy:
    jobs:
      - build:
          filters: &build_filter pipeline.git.branch or (pipeline.git.tag matches /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/)
      - test:
          filters: *build_filter
          requires: [build]
      - deploy:
          filters: pipeline.git.tag matches /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
          requires: [test]
