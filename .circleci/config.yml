version: 2.1

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          keys:
            - &gradle_cache_key gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "settings.gradle" }}-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}-{{ checksum "app/gradle.lockfile" }}
            - builds-{{ .Revision }}
            - app-builds-{{ .Revision }}
jobs:
  build:
    working_directory: ~/norimaki
    docker:
      - image: &android_image cimg/android:2026.11.4
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: Test Gradle Wrapper checksum verification
          command: python3 scripts/test-gradle-wrapper.py
      - restore_gradle_cache
      - run:
          name: Download Dependencies
          command: ./gradlew dependencies
      - run:
          name: Build
          command: ./gradlew assembleDebugUnitTest
      - save_cache:
          paths:
            - ~/.gradle
          key: *gradle_cache_key
      - save_cache:
          paths:
            - ~/norimaki/build
          key: builds-{{ .Revision }}
      - save_cache:
          paths:
            - ~/norimaki/app/build
          key: app-builds-{{ .Revision }}

  test:
    working_directory: ~/norimaki
    docker:
      - image: *android_image
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug
      - run:
          name: Run Tests
          command: ./gradlew jacoco
      - store_test_results:
          path: app/build/test-results/testDebugUnitTest
      - run:
          name: Verify Kotest and Vintage execution
          command: python3 scripts/ci/check-unit-test-results.py
      - run:
          name: Enforce JaCoCo line coverage
          command: |
            python3 scripts/ci/test-check-line-coverage.py
            python3 scripts/ci/check-line-coverage.py app/build/reports/coverage/test/debug/report.xml 89
      - run:
          name: Test release tag validation
          command: bash scripts/ci/test-release-tag.sh
      - run:
          name: Test coverage upload script
          command: bash scripts/ci/test-send-coverage-info.sh
      - run:
          name: Test release credential cleanup
          command: bash scripts/ci/test-release-credentials.sh
      - run:
          name: Test release credential verification
          command: bash scripts/ci/test-verify-release-credentials.sh
      - run:
          name: Test tagged Play deployment
          command: bash scripts/ci/test-play-deploy.sh
      - run:
          name: Test release context restriction
          command: bash scripts/ci/test-release-context.sh
      - run:
          name: Send coverage
          command: ./scripts/ci/send-coverage-info.sh
  deploy:
    working_directory: ~/norimaki
    docker:
      - image: *android_image
    resource_class: large
    environment:
      JVM_OPTS: -Xmx6g
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - run:
          name: Verify release credentials
          command: bash scripts/ci/verify-release-credentials.sh
      - run:
          name: Create release Gradle user home
          command: |
            release_gradle_home=$(mktemp -d)
            printf 'export GRADLE_USER_HOME=%q\n' "$release_gradle_home" >> "$BASH_ENV"
      - run:
          name: Validate release tag
          command: ./gradlew :app:validateReleaseTag
      - run:
          name: Publish APK
          command: ./gradlew publishReleaseApk --track internal

workflows:
  test-and-deploy:
    jobs:
      - build:
          filters: &build_filter pipeline.git.branch or (pipeline.git.tag matches /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/)
      - test:
          filters: *build_filter
          requires: [build]
      - deploy:
          filters: pipeline.git.tag matches /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
          requires: [test]
          context: norimaki-release
