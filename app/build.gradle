import com.github.triplet.gradle.play.tasks.internal.PublishTaskBase

plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '4.1.2'
    id 'jacoco'
}

apply from: 'release-credentials.gradle'

def coverageToolVersion = '0.8.16'

jacoco {
    toolVersion = coverageToolVersion
}

configurations.matching { it.name in ['jacocoAgent', 'androidJacocoAnt'] }.configureEach {
    resolutionStrategy.activateDependencyLocking()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:5.0.10'
    implementation 'com.github.gojuno.koptional:koptional:1.7.0'
    implementation 'com.github.rahatarmanahmed:circularprogressview:2.5.0'
    implementation 'com.github.takuji31.Koreference:koreference:2.0.0'
    implementation 'com.github.unhappychoice:circleci:2.1.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    // RxBinding 4 requires RxJava 3, while the CircleCI client exposes RxJava 2 streams.
    implementation 'com.jakewharton.rxbinding3:rxbinding:3.1.0'
    implementation 'com.jakewharton.rxbinding3:rxbinding-recyclerview:3.1.0'
    implementation 'com.squareup.flow:flow:1.0.0-alpha3'
    implementation 'com.squareup.mortar:mortar:0.20'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.4.21'
    implementation 'org.kodein.di:kodein-di:7.33.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'io.kotest:kotest-runner-junit6:6.2.7'
    testImplementation 'io.kotest:kotest-assertions-core:6.2.7'
    testImplementation 'io.mockk:mockk:1.14.12'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

android {
    namespace = "com.unhappychoice.norimaki"
    compileSdk 37
    buildToolsVersion = '37.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(21)
    }
    signingConfigs {
        release {
            if (releaseKeystore != null) {
                storeFile releaseKeystore
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEYSTORE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEYSTORE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled false
            debuggable false
            testCoverageEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        viewBinding true
    }
    defaultConfig {
        applicationId "com.unhappychoice.norimaki"
        minSdk 23
        targetSdk 36
        versionCode System.getenv("CIRCLE_BUILD_NUM") as Integer ?: 1
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        abortOnError false
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES.txt',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/DEPENDENCIES',
                'META-INF/notice.txt',
                'META-INF/license.txt',
                'META-INF/dependencies.txt',
                'META-INF/LGPL2.1',
                'META-INF/rxjava.properties',
                'META-INF/rxkotlin.properties'
            ]
        }
    }
    testCoverage {
        jacocoVersion = coverageToolVersion
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                useJUnitPlatform()
                jacoco {
                    includeNoLocationClasses = true
                }
            }
        }
    }
}

play {
    enabled = releaseKeystore != null
}

if (releaseKeystore != null && playCredentials != null) {
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        // GPP also uses its extension as an input to local metadata tasks.
        // Give only the API service the credential path.
        def api = gradle.sharedServices.registrations.named("playApi-${variant.applicationId.get()}").get()
        api.parameters.credentials.fileValue(playCredentials)
    }
    tasks.withType(PublishTaskBase).configureEach {
        doFirst {
            materializePlayCredentials()
        }
    }
}

tasks.register('validateReleaseTag') {
    description = 'Verify that the release tag matches the APK version name.'
    def expectedTag = "v${android.defaultConfig.versionName}"
    def releaseTag = providers.environmentVariable('CIRCLE_TAG')
    doLast {
        def actualTag = releaseTag.getOrElse('')
        if (actualTag != expectedTag) {
            throw new GradleException("Release tag '${actualTag}' does not match APK version tag '${expectedTag}'.")
        }
    }
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

tasks.register('jacoco') {
    description = 'Run debug unit tests and generate JaCoCo coverage reports.'
    dependsOn 'createDebugUnitTestCoverageReport'
}
