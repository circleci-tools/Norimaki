import java.nio.file.Files
import java.nio.file.attribute.AclEntry
import java.nio.file.attribute.AclEntryFlag
import java.nio.file.attribute.AclEntryPermission
import java.nio.file.attribute.AclEntryType
import java.nio.file.attribute.FileAttribute
import java.nio.file.attribute.PosixFilePermissions

def credentials = new ReleaseCredentials()
ext.releaseKeystore = credentials.fileFor('RELEASE_KEYSTORE_BASE64', 'release.jks')
ext.playCredentials = credentials.fileFor('PLAY_ACCOUNT_JSON_BASE64', 'play-account.json')
ext.materializePlayCredentials = {
    credentials.materialize('PLAY_ACCOUNT_JSON_BASE64', playCredentials)
}

if (releaseKeystore != null) {
    gradle.buildFinished {
        credentials.close()
    }
    tasks.matching { it.name in ['validateSigningRelease', 'signingReport'] }.configureEach {
        doFirst {
            credentials.materialize('RELEASE_KEYSTORE_BASE64', releaseKeystore)
        }
    }
}

class ReleaseCredentials {
    private final File directory = new File(System.getProperty('java.io.tmpdir'), "norimaki-release-${UUID.randomUUID()}")
    private final Set<File> files = []
    private final Set<File> materialized = []
    private boolean created

    File fileFor(String variable, String name) {
        if (System.getenv(variable) == null) return null
        File file = new File(directory, name)
        files.add(file)
        return file
    }

    synchronized void materialize(String variable, File file) {
        if (materialized.contains(file)) return
        byte[] contents = System.getenv(variable).decodeBase64()
        if (!created) {
            createDirectory()
            created = true
        }
        Files.write(file.toPath(), contents)
        materialized.add(file)
    }

    synchronized void close() {
        if (!created) return
        files.each { Files.deleteIfExists(it.toPath()) }
        Files.delete(directory.toPath())
    }

    private void createDirectory() {
        def path = directory.toPath()
        if (Files.getFileStore(path.parent).supportsFileAttributeView('posix')) {
            Files.createDirectory(path, PosixFilePermissions.asFileAttribute(PosixFilePermissions.fromString('rwx------')))
        } else {
            def owner = path.fileSystem.userPrincipalLookupService.lookupPrincipalByName(System.getProperty('user.name'))
            def access = AclEntry.newBuilder()
                .setType(AclEntryType.ALLOW)
                .setPrincipal(owner)
                .setPermissions(EnumSet.allOf(AclEntryPermission))
                .setFlags(AclEntryFlag.FILE_INHERIT)
                .build()
            Files.createDirectory(path, [name: { 'acl:acl' }, value: { [access] }] as FileAttribute)
        }
    }
}
